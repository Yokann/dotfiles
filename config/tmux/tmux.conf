unbind C-b
unbind l

## Options
set -g prefix C-a
set -g mouse on
set-option -g history-limit 100000
# set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-activity off
setw -g aggressive-resize on
set -g visual-activity on

# keyboard mode
set-option -g status-keys vi
setw -g mode-keys vi

# Remove neovim 's delay when pressing escape in insert mode
set -s escape-time 0

# Active vim keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

## Bind
bind r source-file ~/.config/tmux/tmux.conf\; display-message "Config reloaded!"
# use "v" and "s" to do vertical/horizontal splits, like vim
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# use the vim motion keys to move between panes and resizing
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z # maximize

## Plugins

# Set Tmux plugin to resurrect every time workstation restarted (Ctrl+A Ctrl+S to Save / Ctrl+A Ctrl+R to Resurrect)
# Automatically restore tmux windows when tmux starts.
# set -g @continuum-restore 'on'
# Don't auto-launch tmx at machine boot.  Give me a chance to gcert first.
# set -g @continuum-boot 'off'
# Preserves what was readable in each pane.
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-vim 'session'

set -g @catppuccin_flavour "macchiato"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_current_text " #W"
set -g status-interval 5
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
# set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_kube}"

# set -g @resurrect-capture-pane-contents 'off'

# Load plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "tony-sol/tmux-kubectx"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
